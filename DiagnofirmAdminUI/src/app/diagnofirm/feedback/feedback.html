<p-toast position="top-right"></p-toast>

<div class="flex flex-col divcls">
  <div class="card cardcls file-container">

    <div class="table-container">

      <p-table
        #dt1
        [value]="feedbackList"
        dataKey="id"
        [rows]="10"
        [loading]="loading"
        [rowHover]="true"
        [showGridlines]="true"
        [paginator]="true"
        scrollable="true"
        scrollHeight="70vh"
        [globalFilterFields]="userFields"
        (onFilter)="onFilter($event)"
        (onSort)="onSort($event)">

        <!-- ================= CAPTION ================= -->
        <ng-template #caption>
          <div class="table-toolbar">
            <div class="search-container">

              <!-- CLEAR -->
              <button
                pButton
                label="Clear"
                class="p-button-outlined clear-button"
                icon="pi pi-filter-slash"
                (click)="clear(dt1)">
              </button>

              <!-- EXPORT -->
              <button
                pButton
                icon="pi pi-file-excel"
                class="export-btn"
                (click)="exportToExcel()">
              </button>

              <!-- SEARCH -->
              <p-iconfield iconPosition="left">

                <p-inputicon>
                  <i class="pi pi-search"></i>
                </p-inputicon>

                <input
                  pInputText
                  type="text"
                  [(ngModel)]="globalFilter"
                  (input)="onGlobalFilter(dt1, $event)"
                  placeholder="Search feedback" />

                <p-inputicon
                  (click)="clearFilter(dt1)"
                  *ngIf="filterApplied">
                  <i class="pi pi-times"></i>
                </p-inputicon>

              </p-iconfield>

              <!-- ADD BUTTON -->
              <p-button
                label="Add"
                class="btncls"
                (onClick)="openAddDialog()">
              </p-button>

            </div>
          </div>
        </ng-template>

        <!-- ================= HEADER ================= -->
        <ng-template #header>
          <tr>

            <th *ngFor="let field of userFields"
              pSortableColumn="{{field}}"
              style="min-width:150px">

              {{ userUiFields[userFields.indexOf(field)] }}

              <p-sortIcon [field]="field"></p-sortIcon>

              <p-columnFilter
                [field]="field"
                matchMode="contains"
                type="text"
                display="menu"
                [showOperator]="false"
                [showMatchModes]="false"
                [showAddButton]="false"
                placeholder="Search {{userUiFields[userFields.indexOf(field)]}}">
              </p-columnFilter>

            </th>

            <!-- ACTION -->
            <th frozen="true"
              style="width:10rem; background:#f4f4f4; position:sticky; right:0;">
              Action
            </th>

          </tr>
        </ng-template>

        <!-- ================= BODY ================= -->
        <ng-template #body let-row>
          <tr>

            <td *ngFor="let field of userFields">
              {{ row[field] }}
            </td>

            <!-- ACTION BUTTONS -->
            <td frozen="true"
              style="width:10rem; position:sticky; right:0; background:white;">

              <p-button
                severity="success"
                icon="pi pi-pen-to-square"
                (onClick)="editscreen(row)">
              </p-button>

              &nbsp;

              <p-button
                severity="danger"
                icon="pi pi-trash"
                (onClick)="deleteaction(row.id)">
              </p-button>

            </td>

          </tr>
        </ng-template>

        <!-- EMPTY -->
        <ng-template #emptymessage>
          <tr>
            <td colspan="10">
              No feedback records found.
            </td>
          </tr>
        </ng-template>

        <!-- LOADING -->
        <ng-template #loadingbody>
          <tr>
            <td colspan="10">
              Loading feedback data...
            </td>
          </tr>
        </ng-template>

      </p-table>

      <!-- ================= ADD FEEDBACK ================= -->
      <div *ngIf="addenable">
        <app-addfeedback
          [display]="display"
          (dataReloaded)="onDataReloaded()">
        </app-addfeedback>
      </div>

      <!-- ================= EDIT FEEDBACK ================= -->
      <div *ngIf="editenable">
        <app-editfeedback
          [editdisplayfeedback]="editdisplayfeedback"
          [feedbackData]="feedbackData"
          (editdisplayChange)="backToMain($event)">
        </app-editfeedback>
      </div>

    </div>
  </div>
</div>

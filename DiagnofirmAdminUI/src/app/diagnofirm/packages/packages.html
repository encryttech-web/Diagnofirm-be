<p-toast position="top-right"></p-toast>

<div class="flex flex-col divcls">
  <div class="card cardcls file-container">

    <div class="table-container">
      <p-table #dt1 [value]="packages" dataKey="packageCode" [rows]="10" [paginator]="true" [rowHover]="true"
        [showGridlines]="true" scrollable="true" scrollHeight="70vh" [globalFilterFields]="packageFields">

        <!-- CAPTION -->
        <ng-template #caption>
          <div class="table-toolbar">

            <button pButton label="Clear" class="p-button-outlined" icon="pi pi-filter-slash" (click)="clear(dt1)">
            </button>

            <input pInputText type="text" [(ngModel)]="globalFilter" (input)="onGlobalFilter(dt1, $event)"
              placeholder="Search..." />

            <p-button label="Add" (onClick)="openAddDialog()">
            </p-button>

          </div>
        </ng-template>

        <!-- HEADER -->
        <ng-template #header>
          <tr>
            <th *ngFor="let field of packageFields" pSortableColumn="{{field}}">

              {{ packageUiFields[packageFields.indexOf(field)] }}
              <p-sortIcon [field]="field"></p-sortIcon>

              <p-columnFilter [field]="field" matchMode="contains" display="menu">
              </p-columnFilter>

            </th>

            <th>Action</th>
          </tr>
        </ng-template>

        <!-- BODY -->
        <ng-template #body let-row>
          <tr>

            <!-- dynamic columns -->
            <td *ngFor="let field of packageFields">

              <!-- HTML editor fields -->
              <span *ngIf="field !== 'packageDescription' && field !== 'testParameter'">
                {{ row[field] }}
              </span>

              <div *ngIf="field === 'packageDescription'" [innerHTML]="row.packageDescription">
              </div>

              <div *ngIf="field === 'testParameter'" [innerHTML]="row.testParameter">
              </div>

            </td>

            <!-- ACTION -->
            <td>
              <p-button icon="pi pi-pen-to-square" (onClick)="editscreen(row)">
              </p-button>

              <p-button icon="pi pi-trash" severity="danger" (onClick)="deleteaction(row.id)">
              </p-button>
            </td>

          </tr>
        </ng-template>

      </p-table>

      <!-- ADD -->
      <div *ngIf="addenable">
        <app-addpackages [display]="display" (dataReloaded)="onDataReloaded()">
        </app-addpackages>
      </div>

      <!-- EDIT -->
      <div *ngIf="editenable">
        <app-editpackages [editdisplaypackages]="editdisplaypackages" [packagedata]="packagedata"
          (editdisplayChange)="backtomainChange($event)">
        </app-editpackages>
      </div>
    </div>
  </div>
</div>

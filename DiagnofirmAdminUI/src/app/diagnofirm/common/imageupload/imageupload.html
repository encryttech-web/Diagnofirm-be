
<p-fileUpload
  #fileUploader
  mode="basic"
  name="image"
  accept=".jpg,.jpeg,.png,.webp"
  [auto]="true"
  chooseIcon="pi pi-image"
  chooseLabel="Choose Image"
  (onSelect)="onFileSelect($event)">
</p-fileUpload>

<div class="mt-2">
  <div *ngIf="!Filecountenable" class="valcls">
    {{ filename }}
    <button type="button" (click)="clearFile(fileUploader)" class="btnimgcls">✖</button>
  </div>
</div>

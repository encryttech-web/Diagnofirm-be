<p-dialog [(visible)]="visible" [modal]="true" appendTo="body" [closable]="false" [style]="{ width: '50vw' }"
  [breakpoints]="{ '960px': '90vw', '640px': '100vw' }" contentStyleClass="image-dialog" (onHide)="btncls()" (visibleChange)="handleLiveDemoChange($event)">

  <ng-template pTemplate="header">
    <div class="img-header">
      <span>{{ images?.imagenamevalue }}</span>

      <i class="pi pi-times close-btn" (click)="btncls()"></i>
    </div>
  </ng-template>

  <div class="img-wrapper">
    <img [src]="images.imageBase64value" class="preview-img" />
  </div>

</p-dialog>

<p-toast position="top-right"></p-toast>

<div class="flex flex-col divcls">
    <div class="card cardcls file-container">

        <!-- ✅ Table Wrapper -->
        <div class="table-container">

            <p-table #dt1 
                [value]="productList"
                dataKey="Id"
                [rows]="10"
                [loading]="loading"
                [rowHover]="true"
                [showGridlines]="true"
                [paginator]="true"
                scrollable="true"
                scrollHeight="70vh"
                frozenWidth="12rem"
                [globalFilterFields]="productFields"
                (onFilter)="onFilter($event)"
                (onSort)="onSort($event)">

                <!-- ✅ CAPTION -->
                <ng-template #caption>
                    <div class="table-toolbar">
                        <div class="search-container">

                            <button pButton
                                label="Clear"
                                class="p-button-outlined clear-button"
                                icon="pi pi-filter-slash"
                                (click)="clear(dt1)">
                            </button>

                            <button pButton
                                icon="pi pi-file-excel"
                                class="export-btn"
                                (click)="exportToExcel()">
                            </button>

                            <p-iconfield iconPosition="left">
                                <p-inputicon>
                                    <i class="pi pi-search"></i>
                                </p-inputicon>

                                <input pInputText
                                    type="text"
                                    [(ngModel)]="globalFilter"
                                    (input)="onGlobalFilter(dt1, $event)"
                                    placeholder="Search keyword" />

                                <p-inputicon *ngIf="filterApplied"
                                    (click)="clearFilter(dt1)">
                                    <i class="pi pi-times"></i>
                                </p-inputicon>
                            </p-iconfield>

                            <p-button
                                label="Add"
                                class="btncls"
                                (onClick)="openAddProductDialog()">
                            </p-button>

                        </div>
                    </div>
                </ng-template>

                <!-- ✅ HEADER (Dynamic like your subcategory table) -->
                <ng-template #header>
                    <tr>

                        <th *ngFor="let field of productFields"
                            pSortableColumn="{{field}}"
                            style="min-width:150px;">

                            {{ productUiFields[productFields.indexOf(field)] }}

                            <p-sortIcon [field]="field"></p-sortIcon>

                            <p-columnFilter
                                [field]="field"
                                matchMode="contains"
                                type="text"
                                display="menu"
                                [showOperator]="false"
                                [showMatchModes]="false"
                                [showAddButton]="false"
                                placeholder="Search by {{productUiFields[productFields.indexOf(field)]}}">
                            </p-columnFilter>

                        </th>

                        <!-- ACTION -->
                        <th frozen="true"
                            style="width:10rem; background:#f4f4f4; position:sticky; right:0;">
                            Action
                        </th>

                    </tr>
                </ng-template>

                <!-- ✅ BODY (ONLY SIMPLE DATA like your requirement) -->
                <ng-template #body let-product>
                    <tr>

                        <td *ngFor="let field of productFields"
                            style="min-width:150px;">

                            {{ product[field] }}

                        </td>

                        <!-- ACTION -->
                        <td frozen="true"
                            style="width:10rem; position:sticky; right:0; background:white;">

                            <p-button
                                severity="success"
                                icon="pi pi-pen-to-square"
                                (onClick)="editProduct(product)">
                            </p-button>

                            &nbsp;

                            <p-button
                                severity="danger"
                                icon="pi pi-trash"
                                (onClick)="deleteProduct(product.id)">
                            </p-button>

                        </td>

                    </tr>
                </ng-template>

                <!-- EMPTY -->
                <ng-template #emptymessage>
                    <tr>
                        <td colspan="10">No products found.</td>
                    </tr>
                </ng-template>

                <!-- LOADING -->
                <ng-template #loadingbody>
                    <tr>
                        <td colspan="10">Loading product data. Please wait.</td>
                    </tr>
                </ng-template>

            </p-table>

            <div *ngIf="addenable">
                <app-addproduct [display]="display" (dataReloaded)="onDataReloaded()"></app-addproduct>
            </div>

            <div *ngIf="editenable">
                <app-editproduct [editdisplayproduct]="editdisplayproduct" [productdata]="productdata"
                    (editdisplayChange)="backtomainChange($event)"></app-editproduct>
            </div>

        </div>

    </div>
</div>

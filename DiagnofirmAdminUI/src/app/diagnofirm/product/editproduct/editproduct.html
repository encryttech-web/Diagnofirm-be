<div class="flex flex-col md:flex-row gap-8">
  <div class="md:w-1/2">
    <div class="card">

      <p-dialog [(visible)]="editdisplayproduct"
        [breakpoints]="{ '960px': '75vw' }"
        [style]="{ width: '55vw' }"
        [modal]="true"
        [closable]="false"
        [closeOnEscape]="false">

        <!-- HEADER -->
        <ng-template pTemplate="header">
          <span><h5>Edit Product</h5></span>
          <a class="close-button" (click)="close()">
            <i class="pi pi-times iconcls" style="cursor: pointer;"></i>
          </a>
        </ng-template>

        <!-- FORM START -->
        <form #productForm="ngForm" (ngSubmit)="editbtn(productForm)" novalidate>

          <!-- BLOCK 1 -->
          <div class="card flex flex-col gap-4 cardflx">
            <div class="flex flex-wrap items-start gap-6">

              <!-- PRODUCT CODE -->
              <div class="field">
                <label>Product Code <span class="text-red-500">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <span>{{ prod_code }}</span>
                </div>
                <small class="p-error" *ngIf="productForm.submitted && !prod_code">
                  Product Code is required
                </small>
              </div>

              <!-- CATEGORY -->
              <div class="field">
                <label>Category <span class="text-red-500">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <p-select
                    [options]="getcategoryist"
                    [(ngModel)]="category"
                    optionLabel="categoryname"
                    optionValue="id"
                    name="category"
                    placeholder="Select Category"
                    required>
                  </p-select>
                </div>
                <small class="p-error" *ngIf="productForm.submitted && !category">
                  Category is required
                </small>
              </div>

              <!-- SUBCATEGORY -->
              <div class="field">
                <label>Subcategory <span class="text-red-500">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <p-select
                    [options]="getsubcategoryist"
                    [(ngModel)]="subcategory"
                    optionLabel="subcategoryname"
                    optionValue="id"
                    name="subcategory"
                    placeholder="Select Subcategory"
                    required>
                  </p-select>
                </div>
                <small class="p-error" *ngIf="productForm.submitted && !subcategory">
                  Subcategory is required
                </small>
              </div>

              <!-- PRODUCT HEAD -->
              <div class="field">
                <label>Product Head <span class="text-red-500">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <input pInputText type="text" [(ngModel)]="prod_headname" name="prod_headname" maxlength="200" required />
                </div>
                <small class="p-error" *ngIf="productForm.submitted && !prod_headname">
                  Product Head is required
                </small>
              </div>

            </div>
          </div>

          <!-- BLOCK 2 -->
          <div class="card flex flex-col gap-4 cardflx">
            <div class="flex flex-wrap items-start gap-6">

              <!-- PRODUCT NAME -->
              <div class="field">
                <label>Product Name <span class="text-red-500">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <input pInputText type="text" [(ngModel)]="prod_name" name="prod_name" maxlength="50" required />
                </div>
                <small class="p-error" *ngIf="productForm.submitted && !prod_name">
                  Product Name is required
                </small>
              </div>

              <!-- PRICE -->
              <div class="field">
                <label>Product Price <span class="text-red-500">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <input pInputText type="number" [(ngModel)]="prod_price" name="prod_price" required />
                </div>
                <small class="p-error" *ngIf="productForm.submitted && !prod_price">
                  Product Price is required
                </small>
              </div>

              <!-- DESCRIPTION -->
              <div class="field">
                <label>Product Description</label>
                <div class="flex flex-wrap gap-2 textcls">
                  <input pInputText type="text" [(ngModel)]="prod_desc" name="prod_desc"  />
                </div>
              </div>

              <!-- IMAGE — mandatory only when prod_grpcod is filled -->
              <div class="field">
                <label>Image
                  <span *ngIf="isImageRequired()" class="text-red-500">*</span>
                  <span *ngIf="!isImageRequired()" class="text-500 text-sm">(optional)</span>
                </label>

                <!-- Existing image with remove option -->
                <div *ngIf="deleteenable">
                  <div class="row">
                    <!-- <div class="col-4">
                      <label class="">Image</label>
                    </div> -->
                    <div class="col-8 flex flex-wrap gap-2 textcls">
                      <a class="valcls" (click)="imageviwe()">
                        {{ imagename }}
                        <button type="button" cButtonClose class="btnimgcls">
                          <i class="pi pi-times close-btn" (click)="deleteenablebtn()"></i>
                        </button>
                      </a>
                    </div>
                  </div>
                </div>

                <!-- Upload new image -->
                <div *ngIf="!deleteenable">
                  <div class="flex flex-wrap gap-2 textcls">
                    <app-imageupload (eventName)="someMethod($event)"></app-imageupload>
                  </div>
                </div>

                <!-- Image view dialog -->
                <div *ngIf="visibleImageView && images">
                  <app-imageview [visible]="visibleImageView" [images]="images"></app-imageview>
                </div>

                <!-- Validation error -->
                <small class="p-error"
                  *ngIf="productForm.submitted && isImageRequired() && !deleteenable && !imageFileval?.length">
                  Image is required when Product Group Code is provided
                </small>

                <!-- Hint -->
                <!-- <small *ngIf="prod_grpcod?.trim()" class="text-orange-500">
                  ⚠ Image is required because a Product Group Code is entered.
                </small> -->
              </div>

            </div>
          </div>

          <!-- BLOCK 3 -->
          <div class="card flex flex-col gap-4 cardflx">
            <div class="flex flex-wrap items-start gap-6">

              <!-- GROUP CODE -->
              <div class="field">
                <label>Group Code</label>
                <div class="flex flex-wrap gap-2 textcls">
                  <textarea
                    pInputText
                    id="prod_grpcod"
                    [(ngModel)]="prod_grpcod"
                    name="prod_grpcod"
                    autocomplete="off"
                    (ngModelChange)="onGroupCodeChange()">
                  </textarea>
                </div>
              </div>

              <!-- STATUS -->
              <div class="field">
                <label>Status</label>
                <div class="flex flex-wrap gap-2 textcls">
                  <p-toggleswitch [(ngModel)]="is_active" name="is_active"></p-toggleswitch>
                </div>
              </div>

            </div>
          </div>

          <!-- FOOTER -->
          <div class="space-x-4 footercls">
            <p-button label="Save" type="submit"></p-button>
            <p-button label="Clear" (click)="clear()" class="custom-red-button"></p-button>
          </div>

        </form>

      </p-dialog>
    </div>
  </div>
</div>

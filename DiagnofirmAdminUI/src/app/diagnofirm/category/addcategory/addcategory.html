<p-dialog header="Add category" [(visible)]="display" [breakpoints]="{ '960px': '75vw' }" [style]="{ width: '55vw'}"
  [modal]="true" [closable]="false" [closeOnEscape]="false">

  <ng-template pTemplate="header">
    <span>
      <h5>Add Category</h5>
    </span>
    <a class="close-button" (click)="close()">
      <i class="pi pi-times iconcls" style="cursor: pointer;"></i>
    </a>
  </ng-template>

  <!-- FORM START -->
  <form #categoryForm="ngForm" (ngSubmit)="addbtn(categoryForm)" novalidate>

    <!-- First Block -->
    <div class="card flex flex-col gap-4 cardflx">
      <div class="flex flex-wrap items-start gap-6">

        <div class="field">
          <label for="categorycode">Category Code <span class="text-red-500">*</span></label>
          <div class="flex flex-wrap gap-2 textcls">
            <span>{{ categorycode }}</span>
          </div>
          <!-- <div class="flex flex-wrap gap-2 textcls">
            <input pInputText id="categorycode" type="text" [(ngModel)]="categorycode" name="categorycode" required
              autocomplete="off" maxlength="10"/>
          </div>
          <div *ngIf="categoryForm.submitted && !categorycode" class="p-error">category Code is required.</div> -->
        </div>

        <div class="field">
          <label for="categoryname">Category Name <span class="text-red-500">*</span></label>
          <div class="flex flex-wrap gap-2 textcls">
            <input pInputText id="categoryname" type="text" [(ngModel)]="categoryname" name="categoryname" required
              autocomplete="off" maxlength="50" />
          </div>
          <div *ngIf="categoryForm.submitted && !categoryname" class="p-error">category Name is required.</div>
        </div>

        <div class="field">
          <label for="categorydescription">Category Description <span class="text-red-500">*</span></label>
          <div class="flex flex-wrap gap-2 textcls">
            <input pInputText id="categorydescription" type="text" [(ngModel)]="categorydescription"
              name="categorydescription" required autocomplete="off" maxlength="50" />
          </div>
          <div *ngIf="categoryForm.submitted && !categorydescription" class="p-error">category description is required.
          </div>
        </div>

        <!-- <div class="field">
          <label for="categoryorder">Category Order <span class="text-red-500">*</span></label>
          <div class="flex flex-wrap gap-2 textcls">
            <input pInputText id="categoryorder" type="text" [(ngModel)]="categoryorder" name="categoryorder" required
              autocomplete="off" maxlength="50" />
          </div>
          <div *ngIf="categoryForm.submitted && !categoryorder" class="p-error">category order is required.</div>
        </div> -->

      </div>
    </div>

    <!-- Second Block -->
    <!-- <div class="card flex flex-col gap-4 cardflx">
      <div class="flex flex-wrap items-start gap-6">

        <div class="field">
          <label for="status">Status</label>
          <div class="flex flex-wrap gap-2 textcls">
            <p-toggleswitch [(ngModel)]="checked" name="checked"></p-toggleswitch>
          </div>
        </div>

      </div>
    </div> -->

    <!-- Footer -->
    <div class="space-x-4 footercls">
      <p-button label="Save" type="submit" [disabled]="!categoryForm.valid"></p-button>
      <p-button label="Clear" (click)="clear()" class="custom-red-button" />
    </div>
  </form>

  <!-- FORM END -->

</p-dialog>

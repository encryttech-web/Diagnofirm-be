<p-dialog header="Add FAQ" [(visible)]="display" [breakpoints]="{ '960px': '75vw' }" [style]="{ width: '60vw' }"
    [modal]="true" [closable]="false" [closeOnEscape]="false">

    <!-- HEADER -->
    <ng-template pTemplate="header">

        <span>
            <h5>Add FAQ</h5>
        </span>

        <a class="close-button" (click)="close()">
            <i class="pi pi-times iconcls" style="cursor: pointer;"></i>
        </a>

    </ng-template>

    <!-- FORM -->
    <form #faqForm="ngForm" (ngSubmit)="addbtn(faqForm)" novalidate>

        <!-- ============================= -->
        <!-- FIRST BLOCK -->
        <!-- ============================= -->
        <div class="card flex flex-col gap-4 cardflx">

            <div class="flex flex-wrap items-start gap-6">

                <!-- FAQ CODE -->
                <!-- <div class="field">

                    <label for="faq_code">
                        FAQ Code
                        <span class="text-red-500">*</span>
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">
                        <span>{{ faq_code }}</span>
                    </div>

                </div> -->

                <!-- PRODUCT -->
                <div class="field">

                    <label for="prod_id">
                        Product
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">

                        <!-- <p-select [options]="productList" [(ngModel)]="prod_id" optionLabel="productname"
                            optionValue="id" placeholder="Select Product" name="prod_id">

                        </p-select> -->

                        <!-- PRODUCT -->
                        <p-select [options]="productList" [(ngModel)]="prod_id" optionLabel="productname"
                            optionValue="id" placeholder="Select Product" name="prod_id" [filter]="true"
                            filterBy="productname" [showClear]="true">
                        </p-select>


                    </div>

                </div>

                <!-- SUB CATEGORY -->
                <div class="field">

                    <label for="subcategory_id">
                        Sub Category
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">

                        <!-- <p-select [options]="subcategoryList" [(ngModel)]="subcategory_id" optionLabel="subcategoryname"
                            optionValue="id" placeholder="Select Sub Category" name="subcategory_id">

                        </p-select> -->

                        <!-- SUB CATEGORY -->
                        <p-select [options]="subcategoryList" [(ngModel)]="subcategory_id" optionLabel="subcategoryname"
                            optionValue="id" placeholder="Select Sub Category" name="subcategory_id" [filter]="true"
                            filterBy="subcategoryname" [showClear]="true">
                        </p-select>

                    </div>

                </div>

                <!-- PACKAGE -->
                <div class="field">

                    <label for="packg_id">
                        Package
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">

                        <!-- <p-select [options]="packageList" [(ngModel)]="packg_id" optionLabel="packagename"
                            optionValue="id" placeholder="Select Package" name="packg_id">

                        </p-select> -->

                        <!-- PACKAGE -->
                        <p-select [options]="packageList" [(ngModel)]="packg_id" optionLabel="packagename"
                            optionValue="id" placeholder="Select Package" name="packg_id" [filter]="true"
                            filterBy="packagename" [showClear]="true">
                        </p-select>


                    </div>

                </div>

                <!-- FAQ QUESTION -->
                <div class="field widthcls">

                    <label for="faq_ques">
                        FAQ Question
                        <span class="text-red-500">*</span>
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">

                        <textarea pInputTextarea id="faq_ques" rows="3" [(ngModel)]="faq_ques" name="faq_ques" required>

                        </textarea>

                    </div>

                    <div *ngIf="faqForm.submitted && !faq_ques" class="p-error">

                        FAQ Question is required.

                    </div>

                </div>

            </div>

        </div>

        <!-- ============================= -->
        <!-- SECOND BLOCK -->
        <!-- ============================= -->
        <div class="card flex flex-col gap-4 cardflx">

            <div class="flex flex-wrap items-start gap-6">

                <!-- <div class="field">

                    <label for="faq_name">
                        FAQ Name
                        <span class="text-red-500">*</span>
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">

                        <input pInputText id="faq_name" type="text" [(ngModel)]="faq_name" name="faq_name" required
                            autocomplete="off" maxlength="50" />

                    </div>

                    <div *ngIf="faqForm.submitted && !faq_name" class="p-error">

                        FAQ Name is required.

                    </div>

                </div>

                <div class="field widthcls">

                    <label for="faq_desc">
                        FAQ Description
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">

                        <input pInputText id="faq_desc" type="text" [(ngModel)]="faq_desc" name="faq_desc"
                            autocomplete="off" maxlength="200" />

                    </div>

                </div> -->



                <!-- FAQ ANSWER -->
                <div class="field widthcls">

                    <label for="faq_ans">
                        FAQ Answer
                        <span class="text-red-500">*</span>
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">

                        <!-- <p-editor
                            [(ngModel)]="faq_ans"
                            name="faq_ans"
                            [style]="{ height: '220px' }">

                        </p-editor> -->

                        <textarea pInputText id="faq_ans" type="text" [(ngModel)]="faq_ans" name="faq_ans" required
                            autocomplete="off"></textarea>

                    </div>

                    <div *ngIf="faqForm.submitted && !faq_ans" class="p-error">

                        FAQ Answer is required.

                    </div>

                </div>


                <!-- Home Check -->
                <div class="field">

                    <label for="status">
                        Home
                    </label>

                    <div class="flex flex-wrap gap-2 textcls">

                        <p-toggleswitch [(ngModel)]="faq_homecheck" name="faq_homecheck">
                        </p-toggleswitch>

                    </div>

                </div>

            </div>

        </div>

        <!-- ============================= -->
        <!-- FOOTER -->
        <!-- ============================= -->
        <div class="space-x-4 footercls">

            <p-button label="Save" type="submit" [disabled]="!faqForm.valid">
            </p-button>

            <p-button label="Clear" (click)="clear()" class="custom-red-button">
            </p-button>

        </div>

    </form>

</p-dialog>

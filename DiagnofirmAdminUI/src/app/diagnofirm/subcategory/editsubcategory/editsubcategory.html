<div class="flex flex-col md:flex-row gap-8">
  <div class="md:w-1/2">
    <div class="card">
      <p-dialog header="Edit subcategory" [(visible)]="editdisplaysubcategory" [breakpoints]="{ '960px': '75vw' }"
        [style]="{ width: '55vw'}" [modal]="true" [closable]="false" [closeOnEscape]="false">

        <ng-template pTemplate="header">
          <span>
            <h5>Edit Subcategory</h5>
          </span>
          <a class="close-button" (click)="close()">
            <i class="pi pi-times iconcls" style="cursor: pointer;"></i>
          </a>
        </ng-template>

        <!-- FORM START -->
        <form #subcategoryForm="ngForm" (ngSubmit)="editbtn(subcategoryForm)">

          <div class="card flex flex-col gap-4 cardflx">
            <div class="flex flex-wrap items-start gap-6">

              <div class="field">
                <label for="subcategorycode">Subcategory Code <span style="color: red;">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <span>{{ subcategorycode }}</span>
                </div>
              </div>

              <div class="field">
                <label for="category">Category <span class="text-red-500">*</span></label>

                <div class="flex flex-wrap gap-2 textcls">
                  <p-select [options]="getcategoryist" [(ngModel)]="category" optionLabel="categoryname"
                    optionValue="id" placeholder="Select Category" name="category">
                  </p-select>
                </div>

                <div *ngIf="subcategoryForm.submitted && !category" class="p-error">
                  Category is required.
                </div>
              </div>

              <div class="field">
                <label for="subcategoryname">Subcategory Name <span style="color: red;">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <input pInputText id="subcategoryname" type="text" [(ngModel)]="subcategoryname"
                    name="subcategoryname" required autocomplete="off" maxlength="50" />
                  <small class="p-error" *ngIf="subcategoryForm.submitted && !subcategoryname">subcategory name is
                    required</small>
                </div>
              </div>

              <div class="field">
                <label for="subcategorydescription">Subcategory Description <span style="color: red;">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <textarea pInputText rows="4" [(ngModel)]="subcategorydescription" name="subcategorydescription"
                    required></textarea>
                  <small class="p-error" *ngIf="subcategoryForm.submitted && !subcategorydescription">subcategory
                    description is required</small>
                </div>
              </div>


            </div>
          </div>

          <div class="card flex flex-col gap-4 cardflx">
            <div class="flex flex-wrap items-start gap-6">

               <div class="field">
                <label for="subcategoryorder">Subcategory Content <span style="color: red;">*</span></label>
                <div class="flex flex-wrap gap-2 textcls">
                  <textarea pInputText rows="4" [(ngModel)]="subcategoryorder" name="subcategoryorder"
                    required></textarea>
                  <small class="p-error" *ngIf="subcategoryForm.submitted && !subcategoryorder">subcategory
                    content is required</small>
                </div>
              </div>

              <div class="field">
                <div *ngIf="deleteenable">

                  <div class="row">
                    <div class="col-4">
                      <label class="">Image <span class="text-red-500 atagcls">*</span></label>
                    </div>
                    <div class="col-8">
                      <a class="valcls" (click)="imageviwe()">
                        {{imagename}}
                        <button cButtonClose class="btnimgcls">
                          <i class="pi pi-times close-btn" (click)="deleteenablebtn()"></i>
                        </button>
                      </a>
                    </div>
                  </div>

                </div>

                <div *ngIf="!deleteenable">
                  <app-imageupload (eventName)="someMethod($event)" [testdata]="testdata">
                  </app-imageupload>
                </div>

                <div *ngIf="visibleImageView && images">
                  <app-imageview [visible]="visibleImageView" [images]="images"></app-imageview>
                </div>


              </div>

              <div class="field">
                <label for="status">Status</label>
                <div class="flex flex-wrap gap-2 textcls">
                  <p-toggleswitch [(ngModel)]="checked" name="checked"></p-toggleswitch>
                </div>
              </div>

            </div>
          </div>

          <!-- Footer -->
          <div class="space-x-4 footercls">
            <p-button label="Save" type="submit" [disabled]="!subcategoryForm.valid"></p-button>
            <p-button label="Clear" (click)="clear()" class="custom-red-button"></p-button>
          </div>

        </form>
        <!-- FORM END -->
      </p-dialog>
    </div>
  </div>
</div>

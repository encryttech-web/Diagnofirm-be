<div class="grid grid-cols-12 gap-8">

    <div class="col-span-12 lg:col-span-6 xl:col-span-3">
        <div class="card mb-0">
            <div class="flex justify-between mb-4">
                <div>
                    <span class="block text-muted-color font-medium mb-4">Order</span>
                    <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{allordercount.ordercount}}</div>
                </div>
                <div class="flex items-center justify-center bg-blue-100 dark:bg-blue-400/10 rounded-border"
                    style="width: 2.5rem; height: 2.5rem">
                    <i class="pi pi-shopping-cart text-blue-500 text-xl!"></i>
                </div>
            </div>
            <!-- <span class="text-primary font-medium">24 new </span>
            <span class="text-muted-color">since last visit</span> -->
        </div>
    </div>

    <div class="col-span-12 lg:col-span-6 xl:col-span-3">
        <div class="card mb-0">
            <div class="flex justify-between mb-4">
                <div>
                    <span class="block text-muted-color font-medium mb-4">Product</span>
                    <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{allordercount.productcount}}</div>
                </div>
                <div class="flex items-center justify-center bg-orange-100 dark:bg-orange-400/10 rounded-border"
                    style="width: 2.5rem; height: 2.5rem">
                    <i class="pi pi-dollar text-orange-500 text-xl!"></i>
                </div>
            </div>
            <!-- <span class="text-primary font-medium">%52+ </span>
            <span class="text-muted-color">since last week</span> -->
        </div>
    </div>

    <div class="col-span-12 lg:col-span-6 xl:col-span-3">
        <div class="card mb-0">
            <div class="flex justify-between mb-4">
                <div>
                    <span class="block text-muted-color font-medium mb-4">Package</span>
                    <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{allordercount.packagecount}}</div>
                </div>
                <div class="flex items-center justify-center bg-cyan-100 dark:bg-cyan-400/10 rounded-border"
                    style="width: 2.5rem; height: 2.5rem">
                    <i class="pi pi-users text-cyan-500 text-xl!"></i>
                </div>
            </div>
            <!-- <span class="text-primary font-medium">520 </span>
            <span class="text-muted-color">newly registered</span> -->
        </div>
    </div>

    <div class="col-span-12 lg:col-span-6 xl:col-span-3">
        <div class="card mb-0">
            <div class="flex justify-between mb-4">
                <div>
                    <span class="block text-muted-color font-medium mb-4">Feedback</span>
                    <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{allordercount.feedbackcount}}</div>
                </div>
                <div class="flex items-center justify-center bg-purple-100 dark:bg-purple-400/10 rounded-border"
                    style="width: 2.5rem; height: 2.5rem">
                    <i class="pi pi-comment text-purple-500 text-xl!"></i>
                </div>
            </div>
            <!-- <span class="text-primary font-medium">85 </span>
            <span class="text-muted-color">responded</span> -->
        </div>
    </div>

</div>

<br>

<div class="card mb-8!">
  <div class="font-semibold text-xl mb-4">Recent Sales</div>
  <p-table [value]="allorder" [paginator]="true" [rows]="5" responsiveLayout="scroll">
    <ng-template #header>
      <tr>
        <th>Image</th>
        <th pSortableColumn="productname">Name <p-sortIcon field="productname"></p-sortIcon></th>
        <th pSortableColumn="totalprice">Price <p-sortIcon field="totalprice"></p-sortIcon></th>
        <th>View</th>
      </tr>
    </ng-template>

    <ng-template #body let-order>
      <tr>
        <!-- Image: show product image if exists, else package image, else placeholder -->
        <td style="width: 15%; min-width: 5rem;">
          <img
            *ngIf="order.productimg; else packageImgTpl"
            [src]="'data:image/png;base64,' + order.productimg"
            [alt]="order.productname"
            width="50"
            class="shadow-lg"
            style="border-radius: 6px; object-fit: cover; height: 50px;"
          />
          <ng-template #packageImgTpl>
            <img
              *ngIf="order.packageimg; else noImgTpl"
              [src]="'data:image/png;base64,' + order.packageimg"
              [alt]="order.packagename"
              width="50"
              class="shadow-lg"
              style="border-radius: 6px; object-fit: cover; height: 50px;"
            />
          </ng-template>
          <ng-template #noImgTpl>
            <div style="width:50px; height:50px; background:#f0f0f0; border-radius:6px;
                        display:flex; align-items:center; justify-content:center;">
              <i class="pi pi-image" style="color:#ccc; font-size:1.2rem;"></i>
            </div>
          </ng-template>
        </td>

        <!-- Name: show productname or packagename -->
        <td style="width: 35%; min-width: 7rem;">
          {{ order.productname || order.packagename || '—' }}
        </td>

        <!-- Price -->
        <td style="width: 35%; min-width: 8rem;">
          {{ order.totalprice | currency: 'P' }}
        </td>

        <!-- View -->
        <td style="width: 15%;">
          <button
            pButton pRipple
            type="button"
            icon="pi pi-search"
            class="p-button p-component p-button-text p-button-icon-only"
            (click)="viewOrder(order)">
          </button>
        </td>
      </tr>
    </ng-template>

    <!-- Empty state -->
    <ng-template #emptymessage>
      <tr>
        <td colspan="4" style="text-align:center; padding: 2rem; color: #999;">
          <i class="pi pi-inbox" style="font-size:2rem; display:block; margin-bottom:.5rem;"></i>
          No orders found.
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>
